envVarGroups:
  - name: marscope-jev-secrets
    envVars:
      - key: MARSCOPE_JEV_SERVICE_TOKEN
        generateValue: true

services:
  - type: web
    name: marswalk-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install -r requirements-geospatial.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: JEV_SERVICE_URL
        value: https://marscope-jev.onrender.com
      - fromGroup: marscope-jev-secrets

  - type: web
    name: marscope-jev
    runtime: node
    plan: free
    rootDir: decision-service
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - fromGroup: marscope-jev-secrets
