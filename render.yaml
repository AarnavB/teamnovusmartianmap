services:
  - type: web
    name: marswalk-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install -r requirements-geospatial.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
